<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine KI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat">
        <header>
            <h1>Meine KI</h1>
            <p>Eigene künstliche Intelligenz</p>
        </header>

        <main id="messages">
            <div class="message ai">
                Hallo! Ich bin deine KI. 👋
            </div>
        </main>

        <form id="chat-form">
            <input
                id="user-input"
                type="text"
                placeholder="Schreibe eine Nachricht..."
                autocomplete="off"
            >

            <button type="submit">Senden</button>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>s
